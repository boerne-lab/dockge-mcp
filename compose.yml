version: '3.8'

services:
  dockge-mcp:
    image: ghcr.io/wonderchatai/dockge-mcp:latest
    container_name: dockge-mcp
    ports:
      - "8000:8000"
    environment:
      - DOCKGE_URL=${DOCKGE_URL:-http://localhost:5001}
      - DOCKGE_USERNAME=${DOCKGE_USERNAME:-admin}
      - DOCKGE_PASSWORD=${DOCKGE_PASSWORD:-password}
    env_file:
      - .env
    restart: unless-stopped
